<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. Professor | The Voice of Truth & Poetry</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Merriweather', serif; }
        body.dark-mode { background-color: #0c0a09 !important; color: #f5f5f4 !important; }
        body.dark-mode header { background-color: rgba(28, 25, 23, 0.8) !important; border-color: #292524 !important; }
        body.dark-mode header h1, body.dark-mode h2, body.dark-mode h3, body.dark-mode h4 { color: #ffffff !important; }
        body.dark-mode .custom-card { background-color: #1c1917 !important; border-color: #292524 !important; }
        body.dark-mode .custom-text { color: #a8a29e !important; }
        body.dark-mode .theme-btn { background-color: #292524 !important; color: #f5f5f4 !important; }
        body.dark-mode input, body.dark-mode select, body.dark-mode textarea { background-color: #1c1917 !important; color: #ffffff !important; border-color: #292524 !important; }
    </style>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.addEventListener('DOMContentLoaded', () => { document.body.classList.add('dark-mode'); });
        }
    </script>
</head>
<body class="bg-stone-50 text-stone-800 antialiased transition-colors duration-300">

    <!-- Header -->
    <header class="sticky top-0 bg-white/80 backdrop-blur-md border-b border-stone-200 z-50 transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide text-stone-900">Mr. Professor</h1>
            <div class="flex items-center space-x-6">
                <nav class="space-x-6 text-sm font-medium hidden md:block">
                    <a href="#poems" class="hover:text-amber-700 transition">Poems</a>
                    <a href="#add-poem" class="hover:text-amber-700 transition">Add Poem</a>
                </nav>
                <button onclick="toggleTheme()" class="theme-btn p-2 rounded-full bg-stone-200 text-stone-800 hover:scale-105 transition shadow-xs cursor-pointer">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path></svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Poems Section -->
    <section id="poems" class="max-w-7xl mx-auto px-6 py-16 border-t border-stone-200">
        <h3 class="text-3xl font-bold mb-12 text-center">Selected Poems & Writings</h3>
        
        <div class="mb-16">
            <h4 class="text-2xl font-bold text-amber-900 dark:text-amber-400 mb-6 border-b-2 border-amber-800 pb-2">Truth (सत्य)</h4>
            <div id="truth-container" class="max-w-3xl mx-auto space-y-8"></div>
        </div>
        <div class="mb-16">
            <h4 class="text-2xl font-bold text-amber-900 dark:text-amber-400 mb-6 border-b-2 border-amber-800 pb-2">Healing (निको/मल्हम)</h4>
            <div id="healing-container" class="max-w-3xl mx-auto space-y-8"></div>
        </div>
        <div class="mb-16">
            <h4 class="text-2xl font-bold text-amber-900 dark:text-amber-400 mb-6 border-b-2 border-amber-800 pb-2">Hope (आशा)</h4>
            <div id="hope-container" class="max-w-3xl mx-auto space-y-8"></div>
        </div>
    </section>

    <!-- Add Poem Form -->
    <section id="add-poem" class="max-w-3xl mx-auto px-6 py-16 border-t border-stone-200">
        <div class="custom-card bg-white p-8 md:p-10 rounded-3xl border border-stone-200 shadow-xl">
            <h3 class="text-2xl font-bold mb-6 text-center text-stone-900">Add New Poem (Direct to GitHub)</h3>
            <form id="poem-form" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium mb-2 text-stone-700">कविताको शीर्षक (Title)</label>
                    <input type="text" id="poem-title" required class="w-full px-4 py-3 rounded-xl border border-stone-300">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2 text-stone-700">क्याटेगोरी (Category)</label>
                    <select id="poem-category" required class="w-full px-4 py-3 rounded-xl border border-stone-300">
                        <option value="truth">Truth</option>
                        <option value="healing">Healing</option>
                        <option value="hope">Hope</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2 text-stone-700">मिति (Date)</label>
                    <input type="text" id="poem-date" required class="w-full px-4 py-3 rounded-xl border border-stone-300">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2 text-stone-700">कविताका शब्दहरू</label>
                    <textarea id="poem-content" rows="5" required class="w-full px-4 py-3 rounded-xl border border-stone-300"></textarea>
                </div>
                <button type="submit" class="w-full bg-amber-800 text-white py-3 rounded-xl font-medium hover:bg-amber-900 transition shadow-md cursor-pointer">
                    Commit & Publish to GitHub
                </button>
            </form>
        </div>
    </section>

    <footer class="bg-stone-900 text-stone-300 py-12 text-center text-sm">
        <p>&copy; <span id="current-year"></span> Mr. Professor. All rights reserved.</p>
    </footer>

    <script>
        document.getElementById('current-year').textContent = new Date().getFullYear();

        function toggleTheme() {
            if (document.body.classList.contains('dark-mode')) {
                document.body.classList.remove('dark-mode');
                localStorage.setItem('theme', 'light');
            } else {
                document.body.classList.add('dark-mode');
                localStorage.setItem('theme', 'dark');
            }
        }

        // GitHub Repository Configurations
        const GITHUB_USERNAME = "sunilneupane3208-cloud";
        const REPO_NAME = "cosys-sofware";
        const BRANCH = "main";
        const FILE_PATH = "poems.json";
        const TOKEN = "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"; // GitHub bata generate gareko Token

        // Load poems from poems.json on startup
        async function fetchPoems() {
            try {
                const response = await fetch(`${FILE_PATH}?t=${Date.now()}`);
                const poems = await response.json();
                
                document.getElementById('truth-container').innerHTML = '';
                document.getElementById('healing-container').innerHTML = '';
                document.getElementById('hope-container').innerHTML = '';

                poems.forEach(poem => {
                    appendPoemToDOM(poem.category, poem.title, poem.date, poem.content);
                });
            } catch (error) {
                console.error("Error loading poems:", error);
            }
        }

        function appendPoemToDOM(category, title, date, content) {
            const container = document.getElementById(`${category}-container`);
            if (!container) return;

            const article = document.createElement('article');
            article.className = 'custom-card bg-white p-8 md:p-10 rounded-3xl border border-stone-100 shadow-lg transition-colors duration-300';
            const formattedContent = content.replace(/\n/g, '<br>');
            const capitalizedCategory = category.charAt(0).toUpperCase() + category.slice(1);

            article.innerHTML = `
                <span class="text-xs text-amber-800 font-bold uppercase tracking-widest bg-amber-50 px-3 py-1 rounded-full">${capitalizedCategory}</span>
                <h5 class="text-3xl font-bold mt-5 mb-3 text-stone-900 leading-snug">${title}</h5>
                <p class="custom-text text-sm text-stone-500 mb-6">मिति: ${date}</p>
                <div class="custom-text text-stone-700 leading-relaxed space-y-4 font-serif italic text-lg">
                    <p>${formattedContent}</p>
                </div>
            `;
            container.prepend(article);
        }

        // Form Submit to GitHub API
        document.getElementById('poem-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const title = document.getElementById('poem-title').value;
            const category = document.getElementById('poem-category').value;
            const date = document.getElementById('poem-date').value;
            const content = document.getElementById('poem-content').value;

            const newPoem = { category, title, date, content };

            try {
                alert('GitHub ma upload हुँदैछ, कृपया प्रतीक्षा गर्नुहोस्...');

                // 1. Get current file SHA and content from GitHub
                const getUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`;
                const getRes = await fetch(getUrl, {
                    headers: { 'Authorization': `token ${TOKEN}` }
                });
                const fileData = await getRes.json();
                
                // Decode existing JSON content
                const existingContent = JSON.parse(atob(fileData.content));
                existingContent.push(newPoem);

                // Encode back to Base64
                const updatedContentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(existingContent, null, 2))));

                // 2. Update file on GitHub via PUT request
                const putRes = await fetch(getUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Add new poem: ${title}`,
                        content: updatedContentBase64,
                        sha: fileData.sha,
                        branch: BRANCH
                    })
                });

                if (putRes.ok) {
                    alert('कविता सफलतापूर्वक GitHub मा सेभ भयो! केही मिनेटमा साइटमा लाइभ हुनेछ।');
                    document.getElementById('poem-form').reset();
                    fetchPoems();
                } else {
                    alert('GitHub मा सेभ गर्न सकिएन, टोकन वा नेमसँग सम्बन्धित समस्या भयो।');
                }
            } catch (err) {
                console.error(err);
                alert('त्रुटि देखियो! कन्सोल चेक गर्नुहोस्।');
            }
        });

        window.addEventListener('DOMContentLoaded', fetchPoems);
    </script>
</body>
</html>
